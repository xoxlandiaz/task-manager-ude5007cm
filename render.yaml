# Render Blueprint: веб-сервис + PostgreSQL.
# Render -> New -> Blueprint -> выбрать этот репозиторий.
# HTTPS и прокси даёт сам Render, nginx здесь не нужен.

databases:
  - name: task-manager-db
    plan: free
    databaseName: taskmanager
    user: taskmanager

services:
  - type: web
    name: task-manager
    runtime: node
    plan: free
    branch: main
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: task-manager-db
          property: connectionString
      - key: DATABASE_SSL
        value: "false"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1d
