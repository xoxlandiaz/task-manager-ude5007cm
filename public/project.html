<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Project · TaskFlow</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
      <a class="navbar-brand" href="dashboard.html">TaskFlow</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#main-nav"
              aria-controls="main-nav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="main-nav">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link" href="dashboard.html">My projects</a></li>
        </ul>
        <div class="dropdown">
          <button class="btn btn-outline-light dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
            <span id="user-name">Account</span>
          </button>
          <ul class="dropdown-menu dropdown-menu-end">
            <li><button class="dropdown-item" type="button" id="logout-button">Log out</button></li>
          </ul>
        </div>
      </div>
    </div>
  </nav>

  <main class="container py-4" id="page">
    <nav aria-label="breadcrumb">
      <ol class="breadcrumb">
        <li class="breadcrumb-item"><a href="dashboard.html">My projects</a></li>
        <li class="breadcrumb-item active" aria-current="page" id="crumb-name">Project</li>
      </ol>
    </nav>

    <div class="d-flex flex-wrap align-items-start gap-3 mb-4">
      <div class="me-auto" style="min-width: 0">
        <h1 id="project-name" class="mb-1 placeholder-glow"><span class="placeholder col-6"></span></h1>
        <p id="project-description" class="text-muted mb-0"></p>
      </div>
      <div class="d-flex flex-wrap align-items-center gap-2">
        <div id="member-avatars" class="avatar-stack d-flex me-1"></div>
        <button type="button" class="btn btn-outline-primary" data-bs-toggle="offcanvas" data-bs-target="#members-panel">Members</button>
        <button type="button" class="btn btn-outline-primary d-none" id="edit-project-button"
                data-bs-toggle="modal" data-bs-target="#project-modal">Edit</button>
        <button type="button" class="btn btn-accent" id="add-task-button">+ Add task</button>
      </div>
    </div>

    <!-- Filters work in the browser on loaded tasks -->
    <div class="btn-group flex-wrap mb-4" role="group" aria-label="Filter tasks">
      <input type="radio" class="btn-check" name="task-filter" id="tf-all" value="all" checked>
      <label class="btn btn-outline-primary btn-sm" for="tf-all">All</label>
      <input type="radio" class="btn-check" name="task-filter" id="tf-mine" value="mine">
      <label class="btn btn-outline-primary btn-sm" for="tf-mine">Assigned to me</label>
      <input type="radio" class="btn-check" name="task-filter" id="tf-high" value="high">
      <label class="btn btn-outline-primary btn-sm" for="tf-high">High priority</label>
      <input type="radio" class="btn-check" name="task-filter" id="tf-overdue" value="overdue">
      <label class="btn btn-outline-primary btn-sm" for="tf-overdue">Overdue</label>
    </div>

    <!-- Kanban: three status columns; they stack on phones -->
    <div class="row g-3" id="board">
      <section class="col-12 col-md-4" aria-labelledby="col-todo-title">
        <div class="board-column">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h2 class="h6 fw-bold mb-0" id="col-todo-title">To do</h2>
            <span class="badge rounded-pill bg-white text-dark" data-count="todo">0</span>
          </div>
          <div data-column="todo"></div>
        </div>
      </section>
      <section class="col-12 col-md-4" aria-labelledby="col-progress-title">
        <div class="board-column">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h2 class="h6 fw-bold mb-0" id="col-progress-title">In progress</h2>
            <span class="badge rounded-pill bg-white text-dark" data-count="in_progress">0</span>
          </div>
          <div data-column="in_progress"></div>
        </div>
      </section>
      <section class="col-12 col-md-4" aria-labelledby="col-done-title">
        <div class="board-column">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h2 class="h6 fw-bold mb-0" id="col-done-title">Done</h2>
            <span class="badge rounded-pill bg-white text-dark" data-count="done">0</span>
          </div>
          <div data-column="done"></div>
        </div>
      </section>
    </div>
  </main>

  <!-- Members panel -->
  <div class="offcanvas offcanvas-end" tabindex="-1" id="members-panel" aria-labelledby="members-title">
    <div class="offcanvas-header">
      <h2 class="offcanvas-title h5" id="members-title">Members</h2>
      <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
    </div>
    <div class="offcanvas-body">
      <ul class="list-group list-group-flush mb-4" id="member-list"></ul>

      <!-- Only the owner sees this form -->
      <form id="member-form" class="d-none" novalidate>
        <div id="member-form-alert" class="alert alert-danger d-none" role="alert"></div>
        <label for="member-email" class="form-label">Add by email</label>
        <div class="input-group has-validation">
          <input type="email" class="form-control" id="member-email" name="email" placeholder="name@example.com" required>
          <button class="btn btn-primary" type="submit">Add</button>
          <div class="invalid-feedback">Enter a valid email address.</div>
        </div>
      </form>
    </div>
  </div>

  <!-- Add / edit task dialog -->
  <div class="modal fade" id="task-modal" tabindex="-1" aria-labelledby="task-modal-title" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <form class="modal-content" id="task-form" novalidate>
        <div class="modal-header">
          <h2 class="modal-title h5" id="task-modal-title">New task</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <div id="task-form-alert" class="alert alert-danger d-none" role="alert"></div>
          <div class="mb-3">
            <label for="task-title" class="form-label">Title</label>
            <input type="text" class="form-control" id="task-title" name="title" maxlength="200" required>
            <div class="invalid-feedback">Enter a task title.</div>
          </div>
          <div class="mb-3">
            <label for="task-description" class="form-label">Description <span class="text-muted fw-normal">(optional)</span></label>
            <textarea class="form-control" id="task-description" name="description" rows="3"></textarea>
            <div class="invalid-feedback"></div>
          </div>
          <div class="row g-3">
            <div class="col-sm-6">
              <label for="task-status" class="form-label">Status</label>
              <select class="form-select" id="task-status" name="status">
                <option value="todo">To do</option>
                <option value="in_progress">In progress</option>
                <option value="done">Done</option>
              </select>
              <div class="invalid-feedback"></div>
            </div>
            <div class="col-sm-6">
              <label for="task-priority" class="form-label">Priority</label>
              <select class="form-select" id="task-priority" name="priority">
                <option value="high">High</option>
                <option value="medium" selected>Medium</option>
                <option value="low">Low</option>
              </select>
              <div class="invalid-feedback"></div>
            </div>
            <div class="col-sm-6">
              <label for="task-assignee" class="form-label">Assignee</label>
              <select class="form-select" id="task-assignee" name="assignee_id"></select>
              <div class="invalid-feedback"></div>
            </div>
            <div class="col-sm-6">
              <label for="task-due" class="form-label">Due date</label>
              <input type="date" class="form-control" id="task-due" name="due_date">
              <div class="invalid-feedback"></div>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-primary" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-primary">Add task</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Edit project dialog (owner only) -->
  <div class="modal fade" id="project-modal" tabindex="-1" aria-labelledby="project-modal-title" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <form class="modal-content" id="project-form" novalidate>
        <div class="modal-header">
          <h2 class="modal-title h5" id="project-modal-title">Edit project</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <div id="project-form-alert" class="alert alert-danger d-none" role="alert"></div>
          <div class="mb-3">
            <label for="edit-name" class="form-label">Name</label>
            <input type="text" class="form-control" id="edit-name" name="name" maxlength="150" required>
            <div class="invalid-feedback">Enter a project name.</div>
          </div>
          <div>
            <label for="edit-description" class="form-label">Description</label>
            <textarea class="form-control" id="edit-description" name="description" rows="3"></textarea>
            <div class="invalid-feedback"></div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-danger me-auto" id="delete-project-button">Delete project</button>
          <button type="button" class="btn btn-outline-primary" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-primary">Save</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Confirmation before deleting (used for the project and for members) -->
  <div class="modal fade" id="confirm-modal" tabindex="-1" aria-labelledby="confirm-title" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-sm">
      <div class="modal-content">
        <div class="modal-header">
          <h2 class="modal-title h5" id="confirm-title">Are you sure?</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body"><p class="mb-0" id="confirm-text"></p></div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-primary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-danger" id="confirm-button">Delete</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/project.js"></script>
</body>
</html>
