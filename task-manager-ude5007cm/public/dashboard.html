<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My projects · TaskFlow</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
      <a class="navbar-brand" href="dashboard.html">TaskFlow</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#main-nav"
              aria-controls="main-nav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="main-nav">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link active" aria-current="page" href="dashboard.html">My projects</a></li>
        </ul>
        <div class="dropdown">
          <button class="btn btn-outline-light dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
            <span id="user-name">Account</span>
          </button>
          <ul class="dropdown-menu dropdown-menu-end">
            <li><button class="dropdown-item" type="button" id="logout-button">Log out</button></li>
          </ul>
        </div>
      </div>
    </div>
  </nav>

  <main class="container py-4 py-lg-5">
    <div class="d-flex flex-wrap align-items-end gap-3 mb-4">
      <div class="me-auto">
        <h1 class="mb-1">My projects</h1>
        <p id="summary" class="text-muted mb-0" aria-live="polite"></p>
      </div>
      <div>
        <label for="search" class="visually-hidden">Search projects</label>
        <input type="search" id="search" class="form-control" placeholder="Search projects…">
      </div>
      <button type="button" class="btn btn-accent" data-bs-toggle="modal" data-bs-target="#project-modal">
        + New project
      </button>
    </div>

    <!-- Filter by my role in the project -->
    <div class="btn-group mb-4" role="group" aria-label="Filter projects by role">
      <input type="radio" class="btn-check" name="role-filter" id="filter-all" value="all" checked>
      <label class="btn btn-outline-primary btn-sm" for="filter-all">All</label>
      <input type="radio" class="btn-check" name="role-filter" id="filter-owner" value="owner">
      <label class="btn btn-outline-primary btn-sm" for="filter-owner">Owner</label>
      <input type="radio" class="btn-check" name="role-filter" id="filter-member" value="member">
      <label class="btn btn-outline-primary btn-sm" for="filter-member">Member</label>
    </div>

    <!-- dashboard.js fills this grid -->
    <div id="project-list" class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
      <div class="col">
        <div class="card h-100 placeholder-glow" aria-hidden="true">
          <div class="card-body">
            <span class="placeholder col-7 mb-3"></span>
            <span class="placeholder col-12"></span>
            <span class="placeholder col-9"></span>
          </div>
        </div>
      </div>
    </div>

    <!-- Shown when the user has no projects -->
    <div id="empty-state" class="text-center py-5 d-none">
      <h2>You have no projects yet</h2>
      <p class="text-muted">Create a project, then add tasks and invite your team.</p>
      <button type="button" class="btn btn-accent" data-bs-toggle="modal" data-bs-target="#project-modal">
        Create your first project
      </button>
    </div>
  </main>

  <!-- New project dialog -->
  <div class="modal fade" id="project-modal" tabindex="-1" aria-labelledby="project-modal-title" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <form class="modal-content" id="project-form" novalidate>
        <div class="modal-header">
          <h2 class="modal-title h5" id="project-modal-title">New project</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <div id="project-form-alert" class="alert alert-danger d-none" role="alert"></div>
          <div class="mb-3">
            <label for="project-name" class="form-label">Name</label>
            <input type="text" class="form-control" id="project-name" name="name" maxlength="150" required>
            <div class="invalid-feedback">Enter a project name.</div>
          </div>
          <div>
            <label for="project-description" class="form-label">Description <span class="text-muted fw-normal">(optional)</span></label>
            <textarea class="form-control" id="project-description" name="description" rows="3"></textarea>
            <div class="invalid-feedback"></div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-primary" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-primary">Create project</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
