<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in · TaskFlow</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-dark bg-primary">
    <div class="container">
      <a class="navbar-brand" href="index.html">TaskFlow</a>
    </div>
  </nav>

  <main class="container auth-wrapper">
    <div class="card auth-card mx-auto shadow-sm">
      <div class="card-body p-4">
        <h1 class="h2 mb-4">Log in</h1>

        <!-- Server errors (wrong password etc.) are shown here -->
        <div id="form-alert" class="alert alert-danger d-none" role="alert"></div>

        <!-- novalidate: we show our own Bootstrap-styled messages instead of the browser bubbles -->
        <form id="login-form" novalidate>
          <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input type="email" class="form-control" id="email" name="email"
                   autocomplete="email" required>
            <div class="invalid-feedback">Enter a valid email address.</div>
          </div>

          <div class="mb-4">
            <label for="password" class="form-label">Password</label>
            <input type="password" class="form-control" id="password" name="password"
                   autocomplete="current-password" required>
            <div class="invalid-feedback">Enter your password.</div>
          </div>

          <button type="submit" class="btn btn-primary w-100">
            <span class="spinner-border spinner-border-sm me-2 d-none" aria-hidden="true"></span>
            <span class="btn-label">Log in</span>
          </button>
        </form>

        <p class="mt-4 mb-0 text-center">
          No account? <a href="register.html">Sign up</a>
        </p>
      </div>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
