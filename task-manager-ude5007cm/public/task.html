<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Task · TaskFlow</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
      <a class="navbar-brand" href="dashboard.html">TaskFlow</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#main-nav"
              aria-controls="main-nav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="main-nav">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link" href="dashboard.html">My projects</a></li>
        </ul>
        <div class="dropdown">
          <button class="btn btn-outline-light dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
            <span id="user-name">Account</span>
          </button>
          <ul class="dropdown-menu dropdown-menu-end">
            <li><button class="dropdown-item" type="button" id="logout-button">Log out</button></li>
          </ul>
        </div>
      </div>
    </div>
  </nav>

  <main class="container py-4" id="page">
    <nav aria-label="breadcrumb">
      <ol class="breadcrumb">
        <li class="breadcrumb-item"><a href="dashboard.html">My projects</a></li>
        <li class="breadcrumb-item"><a id="crumb-project" href="dashboard.html">Project</a></li>
        <li class="breadcrumb-item active" aria-current="page" id="crumb-task">Task</li>
      </ol>
    </nav>

    <div class="row g-4" id="task-layout">
      <!-- Left: title, description, comments -->
      <div class="col-lg-8">
        <div class="d-flex align-items-start gap-3 mb-3">
          <h1 id="task-title" class="me-auto mb-0 placeholder-glow" style="min-width: 0; overflow-wrap: anywhere">
            <span class="placeholder col-8"></span>
          </h1>
          <button type="button" class="btn btn-outline-primary" data-bs-toggle="modal" data-bs-target="#details-modal">Edit</button>
        </div>
        <p class="small text-muted" id="task-meta"></p>

        <div class="card mb-4">
          <div class="card-body">
            <h2 class="h6 fw-bold">Description</h2>
            <p id="task-description" class="mb-0 comment-body"></p>
          </div>
        </div>

        <section aria-labelledby="comments-title">
          <h2 id="comments-title" class="mb-3">Comments <span id="comment-count" class="text-muted fw-normal"></span></h2>
          <ul id="comment-list" class="list-unstyled d-flex flex-column gap-3 mb-4"></ul>

          <form id="comment-form" novalidate>
            <label for="comment-body" class="form-label">Add a comment</label>
            <textarea class="form-control mb-2" id="comment-body" name="body" rows="3" required></textarea>
            <div class="invalid-feedback mb-2">Write something first.</div>
            <button type="submit" class="btn btn-primary">Post comment</button>
          </form>
        </section>
      </div>

      <!-- Right: properties (shown first on phones, so status is visible without scrolling) -->
      <div class="col-lg-4 order-first order-lg-last">
        <form class="card" id="props-form" novalidate>
          <div class="card-body d-flex flex-column gap-3">
            <div id="props-alert" class="alert alert-danger d-none mb-0" role="alert"></div>
            <div>
              <label for="prop-status" class="form-label">Status</label>
              <select class="form-select" id="prop-status" name="status">
                <option value="todo">To do</option>
                <option value="in_progress">In progress</option>
                <option value="done">Done</option>
              </select>
              <div class="invalid-feedback"></div>
            </div>
            <div>
              <label for="prop-priority" class="form-label">Priority</label>
              <select class="form-select" id="prop-priority" name="priority">
                <option value="high">High</option>
                <option value="medium">Medium</option>
                <option value="low">Low</option>
              </select>
              <div class="invalid-feedback"></div>
            </div>
            <div>
              <label for="prop-assignee" class="form-label">Assignee</label>
              <select class="form-select" id="prop-assignee" name="assignee_id"></select>
              <div class="invalid-feedback"></div>
            </div>
            <div>
              <label for="prop-due" class="form-label">Due date</label>
              <input type="date" class="form-control" id="prop-due" name="due_date">
              <div class="invalid-feedback"></div>
            </div>
            <button type="submit" class="btn btn-primary">Save changes</button>
            <button type="button" class="btn btn-outline-danger" id="delete-task-button">Delete task</button>
          </div>
        </form>
      </div>
    </div>
  </main>

  <!-- Edit title and description -->
  <div class="modal fade" id="details-modal" tabindex="-1" aria-labelledby="details-title" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <form class="modal-content" id="details-form" novalidate>
        <div class="modal-header">
          <h2 class="modal-title h5" id="details-title">Edit task</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <div id="details-alert" class="alert alert-danger d-none" role="alert"></div>
          <div class="mb-3">
            <label for="edit-title" class="form-label">Title</label>
            <input type="text" class="form-control" id="edit-title" name="title" maxlength="200" required>
            <div class="invalid-feedback">Enter a task title.</div>
          </div>
          <div>
            <label for="edit-description" class="form-label">Description</label>
            <textarea class="form-control" id="edit-description" name="description" rows="5"></textarea>
            <div class="invalid-feedback"></div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-primary" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-primary">Save</button>
        </div>
      </form>
    </div>
  </div>

  <div class="modal fade" id="confirm-modal" tabindex="-1" aria-labelledby="confirm-title" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-sm">
      <div class="modal-content">
        <div class="modal-header">
          <h2 class="modal-title h5" id="confirm-title">Are you sure?</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body"><p class="mb-0" id="confirm-text"></p></div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-primary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-danger" id="confirm-button">Delete</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/task.js"></script>
</body>
</html>
