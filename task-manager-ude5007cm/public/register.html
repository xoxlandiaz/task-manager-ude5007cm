<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign up · TaskFlow</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-dark bg-primary">
    <div class="container">
      <a class="navbar-brand" href="index.html">TaskFlow</a>
    </div>
  </nav>

  <main class="container auth-wrapper">
    <div class="card auth-card mx-auto shadow-sm">
      <div class="card-body p-4">
        <h1 class="h2 mb-4">Create your account</h1>

        <div id="form-alert" class="alert alert-danger d-none" role="alert"></div>

        <form id="register-form" novalidate>
          <div class="mb-3">
            <label for="name" class="form-label">Full name</label>
            <input type="text" class="form-control" id="name" name="name"
                   autocomplete="name" maxlength="100" required>
            <div class="invalid-feedback">Enter your name.</div>
          </div>

          <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input type="email" class="form-control" id="email" name="email"
                   autocomplete="email" maxlength="255" required>
            <div class="invalid-feedback">Enter a valid email address.</div>
          </div>

          <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input type="password" class="form-control" id="password" name="password"
                   autocomplete="new-password" minlength="8" required
                   aria-describedby="password-help">
            <div id="password-help" class="form-text">At least 8 characters.</div>
            <div class="invalid-feedback">Use at least 8 characters.</div>
          </div>

          <div class="mb-4">
            <label for="confirm" class="form-label">Confirm password</label>
            <input type="password" class="form-control" id="confirm" name="confirm"
                   autocomplete="new-password" required>
            <div class="invalid-feedback">Passwords do not match.</div>
          </div>

          <button type="submit" class="btn btn-primary w-100">
            <span class="spinner-border spinner-border-sm me-2 d-none" aria-hidden="true"></span>
            <span class="btn-label">Create account</span>
          </button>
        </form>

        <p class="mt-4 mb-0 text-center">
          Already registered? <a href="login.html">Log in</a>
        </p>
      </div>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
