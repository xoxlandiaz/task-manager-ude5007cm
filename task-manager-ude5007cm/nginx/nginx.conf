# Reverse proxy для docker compose. На Render не используется.
upstream app {
    server app:3000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 1m;

    # Статика из public/ отдаётся напрямую nginx
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # API проксируется в Express
    location /api/ {
        proxy_pass http://app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Файл есть в public/ -> отдать; иначе -> в приложение (например, /login -> login.html)
    location / {
        try_files $uri $uri.html $uri/ @app;
    }

    location @app {
        proxy_pass http://app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~* \.(css|js|png|jpg|jpeg|svg|ico|woff2?)$ {
        expires 7d;
        access_log off;
    }
}
